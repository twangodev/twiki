name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run check
      - run: bun run docs:check
      - run: bun run test
        working-directory: site
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
      - run: bun ../cli/twiki.ts build --target cloudflare
        working-directory: documentation
      - run: bun ../cli/twiki.ts exec -- run check:types
        working-directory: documentation
      - name: Preserve the validated Cloudflare build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tar -cf "$RUNNER_TEMP/twiki-cloudflare.tar" -C documentation/.twiki/site build/.svelte-kit
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: twiki-cloudflare
          path: ${{ runner.temp }}/twiki-cloudflare.tar
          if-no-files-found: error
          retention-days: 3
      - run: bun ../cli/twiki.ts build --target static
        working-directory: documentation

  deploy:
    needs: test
    if: github.repository == 'twangodev/twiki' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: twiki-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://twiki.twango.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Prepare the documentation runtime
        working-directory: documentation
        run: bun ../cli/twiki.ts prepare
      - uses: actions/download-artifact@v8
        with:
          name: twiki-cloudflare
          path: ${{ runner.temp }}/twiki-cloudflare
          digest-mismatch: error
      - name: Restore the validated Cloudflare build
        run: tar -xf "$RUNNER_TEMP/twiki-cloudflare/twiki-cloudflare.tar" -C documentation/.twiki/site
      - name: Deploy the validated build
        working-directory: documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../cli/twiki.ts deploy

  release-please:
    if: github.repository == 'twangodev/twiki' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: twiki-release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    needs: [test, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.package.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level high
      - name: Pack and inspect the release
        id: package
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bun run release:pack
      - name: Test the installed package
        run: bun run release:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-tarball
          path: dist/twiki.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    concurrency:
      group: twiki-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-tarball
          path: dist
          digest-mismatch: error
      - name: Publish with npm OIDC
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: npm publish ./dist/twiki.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org/

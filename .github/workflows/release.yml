name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: twiki-npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'twangodev/twiki'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install the pinned npm client
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Verify release identity
        id: version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REPOSITORY, 'twangodev/twiki');
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag');
          assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/);
          assert.equal(process.env.GITHUB_REF_NAME, 'v' + pkg.version);
          assert.equal(pkg.name, 'twiki');
          assert.notEqual(pkg.private, true);
          assert.equal(pkg.repository.url, 'git+https://github.com/twangodev/twiki.git');
          appendFileSync(process.env.GITHUB_OUTPUT, 'dist-tag=' + (pkg.version.includes('-') ? 'next' : 'latest') + '\n');
          JS
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Validate the CLI
        run: |
          bun run test
          bun run check
      - name: Validate the engine
        working-directory: site
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
        run: bun run test
      - name: Build and type-check the example
        working-directory: examples/vault
        run: |
          bun ../../cli/twiki.ts build --target cloudflare
          bun ../../cli/twiki.ts exec -- run check:types
          bun ../../cli/twiki.ts build --target static
      - name: Pack and inspect the exact release payload
        id: package
        run: |
          git diff --exit-code
          mkdir -p dist
          npm pack --ignore-scripts --json --pack-destination dist > dist/pack.json
          node .github/scripts/verify-package.mjs dist/pack.json
      - name: Smoke-test the installed release tarball
        run: |
          TWIKI_SMOKE_ROOT=$(mktemp -d "$RUNNER_TEMP/twiki-package.XXXXXX")
          trap 'rm -rf "$TWIKI_SMOKE_ROOT"' EXIT
          git archive HEAD examples/vault | tar -x -C "$TWIKI_SMOKE_ROOT" --strip-components=2
          cd "$TWIKI_SMOKE_ROOT"
          printf '{"name":"twiki-release-smoke","private":true,"type":"module"}\n' > package.json
          bun add --exact --ignore-scripts "$GITHUB_WORKSPACE/dist/twiki.tgz"
          ./node_modules/.bin/twiki --version
          ./node_modules/.bin/twiki build --target cloudflare
          ./node_modules/.bin/twiki exec -- run check:types
          ./node_modules/.bin/twiki build --target static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release-tarball
          path: dist/twiki.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-release-tarball
          path: dist
          digest-mismatch: error
      - name: Verify the validated tarball
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          assert.match(process.env.EXPECTED_SHA256, /^[a-f0-9]{64}$/);
          assert.equal(createHash('sha256').update(readFileSync('dist/twiki.tgz')).digest('hex'), process.env.EXPECTED_SHA256);
          JS
      - name: Publish with npm OIDC
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          case "$NPM_DIST_TAG" in latest|next) ;; *) exit 1 ;; esac
          npm publish dist/twiki.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org/

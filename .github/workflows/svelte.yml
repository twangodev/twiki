name: Svelte

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Benchmark builds without deployment or other jobs
        type: boolean
        default: false
      build_mode:
        description: Build mode for performance benchmarks only
        type: choice
        default: serial
        options:
          - serial
          - parallel
          - isolated-serial

permissions:
  contents: read

env:
  FORCE_COLOR: "3"

defaults:
  run:
    working-directory: site

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.performance
    concurrency:
      group: svelte-check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - &configure-submodules
        run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - &checkout-content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - &setup-bun
        uses: oven-sh/setup-bun@v2
      - &bun-cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - &restore-compiler-cache
        uses: actions/cache/restore@v6
        id: compiler-cache
        with:
          path: site/build/generated/compiler-cache.gpg
          key: compiler-encrypted-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-encrypted-v2-${{ runner.os }}-${{ runner.arch }}-
      - &decrypt-compiler-cache
        name: Decrypt compiler cache
        env: &cache-encryption
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: bun tooling/cache.ts restore
      - &install-r
        name: Install R worksheet renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-knitr r-cran-car
      - &install-dependencies
        run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install Lychee 0.24.2
        run: |
          mkdir -p build/tools
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lychee.tar.gz"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C build/tools lychee-x86_64-unknown-linux-gnu/lychee
      - run: bun run check

  unit-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.performance
    concurrency:
      group: svelte-unit-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run test

  browser-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.performance
    concurrency:
      group: svelte-browser-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - *restore-compiler-cache
      - *decrypt-compiler-cache
      - *install-r
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun test ./tests/browser-diagrams.test.ts ./tests/browser-analytics.test.ts
      - run: bun test tests/rmd-build.test.ts
      - run: bun run test:content
      - run: bun run build:all
      - run: bun run test:e2e
      - run: bun run test:publishing

  build-and-deploy:
    concurrency:
      group: svelte-build-and-deploy-${{ github.ref }}
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.performance
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wisconsin.twango.dev
    steps:
      - run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - *restore-compiler-cache
      - *decrypt-compiler-cache
      - *install-r
      - run: bun install --frozen-lockfile
      - &record-build-runtimes
        name: Record build runtimes
        run: |
          node --input-type=module -e 'import { availableParallelism } from "node:os"; console.log(JSON.stringify({ node: process.version, availableCpus: availableParallelism(), platform: process.platform, architecture: process.arch }));'
          bun -e 'console.log("Bun: " + Bun.version)'
          Rscript --vanilla -e 'cat("R: ", R.version.string, "\nknitr: ", as.character(packageVersion("knitr")), "\ncar: ", as.character(packageVersion("car")), "\n", sep = "")'
      - run: bun run build:all
      - run: bunx wrangler d1 migrations apply wisconsin --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Persist the optional cache after the site is live, outside the deployment path.
      - &encrypt-compiler-cache
        name: Encrypt compiler cache
        id: encrypted-cache
        continue-on-error: true
        env: *cache-encryption
        run: bun tooling/cache.ts save
      - &save-compiler-cache
        uses: actions/cache/save@v6
        if: steps.encrypted-cache.outputs.ready == 'true'
        continue-on-error: true
        with:
          path: site/build/generated/compiler-cache.gpg
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    concurrency:
      group: svelte-performance-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_TIMEOUT_SECONDS: "1200"
      WISCONSIN_BUILD_MODE: ${{ inputs.build_mode || 'serial' }}
    steps:
      - *configure-submodules
      - *checkout-content
      - *setup-bun
      - *bun-cache
      - *restore-compiler-cache
      - *decrypt-compiler-cache
      - *install-r
      - *install-dependencies
      - *record-build-runtimes
      - name: Record benchmark build mode
        run: |
          bun -e '
            import { rFontIdentity } from "./tooling/lib/r-runtime.ts";
            const buildMode = process.env.WISCONSIN_BUILD_MODE;
            if (!["serial", "parallel", "isolated-serial"].includes(buildMode)) throw new Error("Unsupported benchmark build mode");
            const probeStarted = performance.now();
            const fontIdentity = rFontIdentity();
            const fontIdentityVerified = /^fontconfig-v1:[a-f0-9]{64}$/.test(fontIdentity);
            const probeMilliseconds = Math.round(performance.now() - probeStarted);
            console.log(JSON.stringify({ buildMode, fontIdentityVerified, probeMilliseconds }));
          '
      - name: Benchmark restored compiler cache with fresh output
        run: bun tooling/benchmark.ts build ci-first
      - name: Benchmark retained compiler cache and output
        run: bun tooling/benchmark.ts build ci-warm
      - name: Summarize benchmark measurements
        if: always()
        run: |
          bun -e '
            import { appendFileSync, existsSync, readFileSync } from "node:fs";
            for (const label of ["ci-first", "ci-warm"]) {
              const file = `build/benchmarks/${label}.json`;
              if (!existsSync(file)) continue;
              const { success, seconds, exitCode, exitSignal, host } = JSON.parse(readFileSync(file, "utf8"));
              const result = { success, seconds, exitCode, exitSignal, host, buildMode: process.env.WISCONSIN_BUILD_MODE };
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${label}\n\n\`\`\`json\n${JSON.stringify(result, null, 2)}\n\`\`\`\n\n`);
            }
          '
      # Retain current fingerprints for a later fresh-runner benchmark.
      - *encrypt-compiler-cache
      - *save-compiler-cache

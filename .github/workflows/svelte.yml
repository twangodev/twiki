name: Svelte

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "3"

defaults:
  run:
    working-directory: site

jobs:
  check:
    concurrency:
      group: svelte-check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - &restore-compiler-cache
        uses: actions/cache/restore@v6
        id: compiler-cache
        with:
          path: site/build/generated/compiler-cache.gpg
          key: compiler-encrypted-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock', 'site/tooling/**', 'site/src/lib/config.ts', 'site/src/lib/metadata.ts', 'site/src/lib/types.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-encrypted-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock', 'site/tooling/**', 'site/src/lib/config.ts', 'site/src/lib/metadata.ts', 'site/src/lib/types.ts') }}-
      - &decrypt-compiler-cache
        name: Decrypt compiler cache
        env: &cache-encryption
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: bun tooling/cache.ts restore
      - &install-r
        name: Install R worksheet renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-knitr
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install Lychee 0.24.2
        run: |
          mkdir -p build/tools
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lychee.tar.gz"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C build/tools lychee-x86_64-unknown-linux-gnu/lychee
      - run: bun run check

  unit-tests:
    concurrency:
      group: svelte-unit-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run test

  browser-tests:
    concurrency:
      group: svelte-browser-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - *restore-compiler-cache
      - *decrypt-compiler-cache
      - *install-r
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun test ./tests/browser-diagrams.test.ts ./tests/browser-analytics.test.ts
      - run: bun test tests/rmd-build.test.ts
      - run: bun run test:content
      - run: bun run build:all
      - run: bun run test:e2e
      - run: bun run test:publishing

  build-and-deploy:
    concurrency:
      group: svelte-build-and-deploy-${{ github.ref }}
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wisconsin.twango.dev
    steps:
      - run: git config --global submodule.fetchJobs 8
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - *restore-compiler-cache
      - *decrypt-compiler-cache
      - *install-r
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: bunx wrangler d1 migrations apply wisconsin --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Encrypt compiler cache
        id: encrypted-cache
        env: *cache-encryption
        run: bun tooling/cache.ts save
      - uses: actions/cache/save@v6
        if: steps.encrypted-cache.outputs.ready == 'true'
        with:
          path: site/build/generated/compiler-cache.gpg
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

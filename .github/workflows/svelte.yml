name: twiki

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run check
      - run: bun run test
        working-directory: site
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
      - run: bun ../../cli/twiki.ts build --target cloudflare
        working-directory: examples/vault
      - run: bun ../../cli/twiki.ts exec -- run check:types
        working-directory: examples/vault
      - run: bun ../../cli/twiki.ts build --target static
        working-directory: examples/vault

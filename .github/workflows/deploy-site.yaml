# =============================================================================
# SvelteKit site (site/) → Cloudflare Workers static assets.
#
# This is now the SINGLE deploy/CI workflow for the repo. Quartz has been
# decommissioned: the old `build-and-deploy.yaml` (GitHub Pages / Quartz) is
# gone, and the repo-root `public/` it built no longer exists. The parity and
# anchor gates run against the frozen Quartz snapshot in `site/baseline/`.
#
# The SvelteKit production branch is main; v4 retains the legacy Quartz site.
# The GH Pages deploy no longer runs, so https://wisconsin.twango.dev (still
# DNS-pointed at GitHub Pages) freezes at its last Pages build until the DNS
# cutover. This workflow BUILDS + VERIFIES on every push/PR but does NOT deploy
# anywhere yet (the deploy job is gated off — see below).
#
# DNS / CUTOVER CHECKLIST: see `site/ARCHITECTURE.md` (§6 Phase 5 + the
# "As built" / trailing-slash notes). The GH-Pages trailing-slash behavior
# described there remains true for the live site until DNS is repointed.
#
# DEPLOY ACTIVATION CHECKLIST (the deploy step is gated off until all are done):
#   1. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#      (Workers Scripts:Edit + Workers Assets, or the "Edit Workers" template).
#   2. Confirm `secrets.PAT_TOKEN` still has read on all 16 content submodules
#      (the same token the build/checkout below already uses).
#   3. Flip RUN_DEPLOY below to 'true'.
# Until then deploy is a no-op; build+verify still runs and uploads an artifact.
# =============================================================================
name: Build & Deploy Site (SvelteKit → Cloudflare)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare (requires CLOUDFLARE_* secrets + RUN_DEPLOY=true)"
        type: boolean
        default: false

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

env:
  # Master deploy switch. Keep 'false' until the activation checklist above is
  # done. Build + verify always run regardless of this flag.
  RUN_DEPLOY: "false"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build, verify & (optionally) deploy SvelteKit site
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: "recursive"
          token: ${{ secrets.PAT_TOKEN }}
          clean: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache content prebuild
        uses: actions/cache@v4
        with:
          # Stage-1 parse cache + git-date cache; keyed on pipeline inputs.
          path: site/.generated/cache
          key: ${{ runner.os }}-content-${{ hashFiles('site/scripts/**', 'content/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-content-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build:all = build:content (prebuild) → build (vite + strict prerender
      # crawl: broken-link/anchor gates against site/baseline/) → build:search
      # (Pagefind). prepare-static runs inside `build` and cross-checks broken
      # anchors against the frozen baseline.
      - name: Build (content + vite/prerender + search)
        run: bun run build:all

      - name: Type & style check
        run: bun run check

      - name: Unit tests (slug + pagefind-url)
        run: bun test scripts

      - name: Install browser for interaction parity tests
        run: bunx playwright install --with-deps chromium

      - name: Browser interaction parity tests
        run: bun run test:e2e

      # Golden-diff parity gate against the frozen Quartz baseline
      # (site/baseline/). Fails the build on any unexplained slug/link diff.
      - name: Parity gate (vs frozen Quartz baseline)
        run: bun scripts/parity.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-cloudflare-build
          path: site/.svelte-kit/cloudflare
          if-no-files-found: error
          retention-days: 7

      # ----------------------------------------------------------------------
      # Deploy — gated. Runs only when RUN_DEPLOY=='true'. On manual dispatch it
      # additionally requires the `deploy` input. Requires CLOUDFLARE_API_TOKEN
      # + CLOUDFLARE_ACCOUNT_ID. Inactive until the activation checklist is done.
      # ----------------------------------------------------------------------
      - name: Deploy to Cloudflare Workers
        if: ${{ env.RUN_DEPLOY == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          # wrangler.jsonc points main at .svelte-kit/cloudflare/_worker.js and
          # serves the prerendered assets from that directory.
          command: deploy

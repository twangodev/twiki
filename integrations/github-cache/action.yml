name: Encrypted build products
description: Restore or save independently verified application, course and search products
inputs:
  mode:
    description: restore or save
    required: true
  namespace:
    description: Cache namespace (production)
    default: production
  transport:
    description: One bundle of independently encrypted product groups
    default: bundle
outputs:
  requested:
    description: Product groups requested
  hits:
    description: Encrypted archive cache hits before product verification
  misses:
    description: Encrypted archive cache misses
  restored:
    description: Product groups verified and restored
  rebuild_needed:
    description: Requested groups unavailable for reuse
  published:
    description: Verified product archives published
  skipped:
    description: Save operations skipped or already cached
  failed:
    description: Optional cache operations that failed
runs:
  using: node24
  main: dist/index.js
